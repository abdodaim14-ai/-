<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المحفوظات | داعم المواهب للقرآن الكريم</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--gold:#d4af37;--bg:#030508;--panel:#111a27;--line:rgba(212,175,55,.3);--muted:#aeb7c4}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#182333,var(--bg) 60%);color:#f4f4f4;font-family:Tahoma,Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:0 14px 70px}.social-header{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 12px;background:#0a0f17f5;border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}.social-brand img{width:52px;height:52px;object-fit:contain}.social-nav{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.social-nav a,.btn{color:#f2d477;text-decoration:none;border:1px solid var(--line);border-radius:12px;padding:9px 12px;background:#131d2a;cursor:pointer;font:inherit}.social-nav a[aria-current=page]{background:#403315}.title{text-align:center;color:var(--gold);margin:25px 0 8px}.sub{text-align:center;color:var(--muted);line-height:1.8}.card{background:linear-gradient(145deg,#172231f2,#0d131df2);border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0}.post{display:flex;gap:12px;align-items:flex-start}.post img{width:100px;height:90px;object-fit:cover;border-radius:12px;background:#222}.post a{color:#f4d36f;text-decoration:none;font-weight:bold}.muted{color:var(--muted);font-size:.88rem}.status{text-align:center;color:var(--gold);min-height:28px}@media(max-width:560px){.social-header{gap:5px;padding:7px}.social-brand img{width:42px;height:42px}.social-nav{gap:4px}.social-nav a,.btn{padding:7px 8px;font-size:.82rem}.post img{width:76px;height:76px}}
</style></head><body><main class="wrap">
<header class="social-header"><a class="social-brand" href="index.html"><img src="https://i.postimg.cc/0yZxfgx2/Picsart-26-01-13-17-01-28-072.png" alt="شعار داعم المواهب"></a><nav class="social-nav"><a href="index.html"><i class="bi bi-house"></i> الرئيسية</a><a href="community.html" title="القصص والاستطلاعات"><i class="bi bi-stars"></i><span>القصص</span></a><a href="posts.html"><i class="bi bi-grid"></i> المنشورات</a><a href="library.html"><i class="bi bi-headphones"></i> التلاوات</a><a href="readers.html"><i class="bi bi-mic-fill"></i> القراء</a><a href="contests.html"><i class="bi bi-trophy-fill"></i> المسابقات</a><a href="saved.html" aria-current="page"><i class="bi bi-bookmark-star"></i> المحفوظات</a><a href="messages.html"><i class="bi bi-chat"></i> الرسائل</a><a href="profile.html"><i class="bi bi-person"></i> ملفي</a><a href="donate.html"><i class="bi bi-heart-fill"></i> التبرع</a></nav><button class="btn" id="logout" hidden>خروج</button></header>
<h1 class="title"><i class="bi bi-bookmark-star-fill"></i> منشوراتي المحفوظة</h1><p class="sub">كل المنشورات التي احتفظت بها لتعود إليها وقتما تشاء.</p><div id="items"></div><div class="status" id="status"></div>
</main><script>
(()=>{'use strict';const URL='https://xkraqrjkimkdawlazjyl.supabase.co',KEY='sb_publishable_QXPRwlQsN2-5a-hy5ejKJA_2tmf7MJr',db=supabase.createClient(URL,KEY),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let user=null;
async function load(){if(!user){$('items').innerHTML='<section class="card">سجّل الدخول لعرض منشوراتك المحفوظة. <a href="index.html#accountPanel" style="color:#f4d36f">تسجيل الدخول</a></section>';return;}const {data:marks,error}=await db.from('platform_post_bookmarks').select('post_id,created_at').eq('user_id',user.id).order('created_at',{ascending:false});if(error){$('status').textContent='تعذر تحميل المحفوظات: '+error.message;return;}const ids=(marks||[]).map(x=>x.post_id);if(!ids.length){$('items').innerHTML='<section class="card">لم تحفظ أي منشورات بعد. افتح صفحة <a href="posts.html" style="color:#f4d36f">المنشورات</a> واضغط حفظ على المنشور الذي يعجبك.</section>';return;}const {data:posts,error:e}=await db.from('platform_posts').select('id,user_id,content,image_url,created_at').in('id',ids).eq('is_published',true);if(e){$('status').textContent=e.message;return;}const ordered=ids.map(id=>(posts||[]).find(p=>p.id===id)).filter(Boolean);const userIds=[...new Set(ordered.map(p=>p.user_id))];const {data:profiles}=await db.from('profiles').select('id,display_name').in('id',userIds);const names=Object.fromEntries((profiles||[]).map(p=>[p.id,p.display_name]));$('items').innerHTML=ordered.map(p=>`<article class="card post"><div style="flex:1"><a href="posts.html#post-${p.id}">${esc(names[p.user_id]||'عضو')}</a><p>${esc(p.content||'')}</p><small class="muted">${new Date(p.created_at).toLocaleString('ar-EG')}</small><p><a href="posts.html#post-${p.id}">فتح المنشور</a> · <button class="btn" data-remove="${p.id}">إزالة من المحفوظات</button></p></div>${p.image_url?`<img loading="lazy" src="${esc(p.image_url)}" alt="صورة المنشور">`:''}</article>`).join('')||'<section class="card">المنشورات المحفوظة غير متاحة أو لم تعد منشورة.</section>';}
$('items').addEventListener('click',async e=>{const b=e.target.closest('[data-remove]');if(!b)return;const {error}=await db.from('platform_post_bookmarks').delete().eq('post_id',b.dataset.remove).eq('user_id',user.id);if(error)$('status').textContent=error.message;else load();});
async function init(){const {data:{session}}=await db.auth.getSession();user=session?.user||null;$('logout').hidden=!user;$('logout').onclick=async()=>{await db.auth.signOut();location.href='index.html';};db.auth.onAuthStateChange((_e,s)=>{user=s?.user||null;$('logout').hidden=!user;load();});await load();}init().catch(e=>$('status').textContent=e.message);})();
</script></body></html>
