<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>القصص والاستطلاعات | داعم المواهب</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--gold:#d4af37;--bg:#080c13;--panel:#121b28;--line:rgba(212,175,55,.28);--muted:#aeb7c4}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#1b2635,var(--bg) 58%);color:#f7f4ec;font-family:Tahoma,Arial,sans-serif}.wrap{max-width:950px;margin:auto;padding:0 14px 80px}.social-header{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px;background:#080c13ed;border-bottom:1px solid var(--line)}.social-brand img{width:48px;height:48px;object-fit:contain}.social-nav{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}.social-nav a,.btn{color:var(--gold);text-decoration:none;border:1px solid var(--line);border-radius:12px;padding:9px 12px;background:#131d2a;cursor:pointer;font:inherit}.title{text-align:center;color:var(--gold);font-size:1.7rem;margin:24px 0 6px}.sub{text-align:center;color:var(--muted);line-height:1.8}.card{background:linear-gradient(145deg,#172231f2,#0d131df2);border:1px solid var(--line);border-radius:19px;padding:18px;margin:15px 0}.card h2,.card h3{color:var(--gold);margin-top:0}.story{border-top:1px solid #ffffff16;padding:15px 0;line-height:1.9}.story img{width:100%;max-height:420px;object-fit:cover;border-radius:13px}.muted{color:var(--muted);font-size:.88rem}.poll-option{display:flex;gap:9px;align-items:center;padding:11px;margin:8px 0;border:1px solid #ffffff20;border-radius:12px;background:#ffffff08}.poll-option input{width:auto;accent-color:var(--gold)}.result{height:8px;border-radius:20px;background:#ffffff17;overflow:hidden;margin-top:6px}.result span{display:block;height:100%;background:linear-gradient(90deg,#9b7620,#f7d977)}.status{text-align:center;color:var(--gold);min-height:28px}.empty{text-align:center;color:var(--muted);padding:20px}.btn:disabled{opacity:.45;cursor:not-allowed}@media(max-width:650px){.social-header{flex-wrap:wrap;justify-content:center}.title{font-size:1.4rem}}
</style></head><body><main class="wrap"><header class="social-header"><a class="social-brand" href="index.html"><img src="https://i.postimg.cc/0yZxfgx2/Picsart-26-01-13-17-01-28-072.png" alt="داعم المواهب"></a><nav class="social-nav"><a href="index.html">الرئيسية</a><a href="posts.html">المنشورات</a><a href="library.html">التلاوات</a><a href="readers.html">القراء</a><a href="contests.html">المسابقات</a><a href="profile.html">ملفي</a></nav><button class="btn" id="authBtn">تسجيل الدخول</button></header><h1 class="title"><i class="bi bi-stars"></i> قصص واستطلاعات المجتمع</h1><p class="sub">مساحة للكلمة الطيبة، ومشاركة الرأي، وتشجيع أهل القرآن.</p><section class="card"><h2><i class="bi bi-book-half"></i> قصص ورسائل نافعة</h2><div id="stories"><div class="empty">جاري تحميل القصص...</div></div></section><section class="card"><h2><i class="bi bi-bar-chart-fill"></i> شارك في الاستطلاعات</h2><div id="polls"><div class="empty">جاري تحميل الاستطلاعات...</div></div></section><div class="status" id="status" role="status"></div></main><script>
(()=>{'use strict';const URL='https://xkraqrjkimkdawlazjyl.supabase.co',KEY='sb_publishable_QXPRwlQsN2-5a-hy5ejKJA_2tmf7MJr',db=window.supabase.createClient(URL,KEY),$=id=>document.getElementById(id);let user=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const say=t=>$('status').textContent=t||'';async function auth(){const {data:{session}}=await db.auth.getSession();user=session?.user||null;$('authBtn').textContent=user?'تسجيل الخروج':'تسجيل الدخول';$('authBtn').onclick=async()=>{if(user){await db.auth.signOut();location.reload()}else location.href='index.html#accountPanel'};}async function loadStories(){const {data,error}=await db.rpc('phase5_list_public_stories');if(error)throw error;$('stories').innerHTML=(data||[]).map(s=>`<article class="story"><h3>${esc(s.title)}</h3><div class="muted">${new Date(s.created_at).toLocaleDateString('ar-EG')}</div><p style="white-space:pre-wrap">${esc(s.body)}</p>${s.image_url?`<img src="${esc(s.image_url)}" alt="">`:''}</article>`).join('')||'<div class="empty">لا توجد قصص منشورة حاليًا.</div>';}async function loadPolls(){const {data,error}=await db.rpc('phase5_list_public_polls');if(error)throw error;const rows=Array.isArray(data)?data:[];$('polls').innerHTML=rows.map(p=>{const total=p.options.reduce((a,o)=>a+Number(o.votes||0),0),voted=!!p.my_vote,ended=p.ends_at&&new Date(p.ends_at)<=new Date();return `<article class="story" data-poll="${p.id}"><h3>${esc(p.question)}</h3>${p.description?`<p>${esc(p.description)}</p>`:''}${p.options.map(o=>{const pct=total?Math.round(Number(o.votes||0)*100/total):0;return `<label class="poll-option"><input type="radio" name="poll-${p.id}" value="${o.id}" ${p.my_vote===o.id?'checked':''} ${voted||ended?'disabled':''}><span style="flex:1">${esc(o.option_text)}<div class="result"><span style="width:${pct}%"></span></div></span><b>${pct}%</b></label>`}).join('')}<div class="muted">${total} صوت · ${ended?'انتهى التصويت':voted?'يمكنك تغيير اختيارك':'يمكنك التصويت مرة واحدة وتعديل اختيارك'}</div><button class="btn vote" data-id="${p.id}" ${!user||voted||ended?'disabled':''}>${!user?'سجّل الدخول للتصويت':voted?'تم تسجيل تصويتك':ended?'انتهى الاستطلاع':'إرسال التصويت'}</button></article>`}).join('')||'<div class="empty">لا توجد استطلاعات متاحة حاليًا.</div>';}$('polls').addEventListener('click',async e=>{const b=e.target.closest('.vote');if(!b)return;const p=b.dataset.id,choice=document.querySelector(`input[name="poll-${p}"]:checked`);if(!choice){say('اختار إجابة الأول.');return;}try{b.disabled=true;const {error}=await db.rpc('phase5_cast_poll_vote',{p_poll_id:p,p_option_id:choice.value});if(error)throw error;say('تم تسجيل تصويتك.');await loadPolls();}catch(x){say('تعذر التصويت: '+x.message);b.disabled=false;}});(async()=>{try{await auth();await Promise.all([loadStories(),loadPolls()]);}catch(e){say('تعذر تحميل المحتوى. تأكد من تنفيذ ملف SQL للمرحلة الخامسة: '+e.message);}})();})();
</script></body></html>
