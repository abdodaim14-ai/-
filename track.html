
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#030508">
<title>تتبع الطلب | داعم المواهب للقرآن الكريم</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px;background:#030508;color:#f3f4f6;font-family:Tahoma,Arial,sans-serif;display:grid;place-items:center}
main{width:min(100%,620px);background:rgba(12,16,24,.92);border:1px solid rgba(212,175,55,.4);border-radius:24px;padding:clamp(20px,5vw,36px);box-shadow:0 20px 60px #000}
h1{color:#f7d070;text-align:center;font-size:clamp(22px,5vw,30px)}p{line-height:1.9;color:#d1d5db}
form{display:flex;gap:10px;margin-top:22px}input{min-width:0;flex:1;padding:15px;border-radius:12px;border:1px solid #75602d;background:#080b10;color:#fff;font-size:16px}button{padding:14px 20px;border:0;border-radius:12px;background:linear-gradient(135deg,#ffe066,#d4af37,#996515);font-weight:bold;font-size:16px;cursor:pointer}
#result{display:none;margin-top:20px;padding:18px;border:1px solid #6c5728;border-radius:16px;line-height:2;overflow-wrap:anywhere}#result.show{display:block}.status{display:inline-block;color:#f7d070;background:#3a3018;border-radius:30px;padding:4px 14px;font-weight:bold}.id{direction:ltr;unicode-bidi:isolate;color:#f7d070;font-weight:bold}
a{color:#f7d070}@media(max-width:520px){body{padding:12px}form{flex-direction:column}button{width:100%;min-height:48px}}
</style>
</head>
<body>
<main>
<h1><i class="bi bi-search"></i> تتبع طلبك</h1>
<p>اكتب رقم الطلب الذي ظهر لك بعد إرسال التلاوة لمعرفة آخر حالة مسجلة لطلبك.</p>
<form id="trackForm"><input id="requestId" maxlength="40" required placeholder="DAA-2026-XXXXXXXXXX" aria-label="رقم الطلب"><button type="submit">بحث عن الطلب</button></form>
<div id="result" aria-live="polite"></div>
<p style="text-align:center;margin-top:24px"><a href="./">العودة إلى الصفحة الرئيسية</a></p>
</main>
<script>
const endpoint='https://script.google.com/macros/s/AKfycby6ld_6DTSrz9vwvyeOZy1eosY7hPNwbWXT_pPxV8HmXDNm9xLX3OZ6YDCGDcFcRBSIgQ/exec';
const result=document.getElementById('result');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function lookup(id){return new Promise((resolve,reject)=>{const cb='daaTrack'+Date.now()+Math.random().toString(36).slice(2);const s=document.createElement('script');const timer=setTimeout(()=>done(new Error('انتهت مهلة الاتصال. حاول مرة أخرى.')),15000);function done(err,data){clearTimeout(timer);delete window[cb];s.remove();err?reject(err):resolve(data)}window[cb]=data=>done(null,data);s.onerror=()=>done(new Error('تعذر الاتصال بخدمة التتبع.'));s.src=endpoint+'?track='+encodeURIComponent(id)+'&callback='+cb+'&_='+Date.now();document.head.appendChild(s);});}
document.getElementById('trackForm').addEventListener('submit',async e=>{e.preventDefault();result.className='show';result.textContent='جاري البحث...';try{const d=await lookup(document.getElementById('requestId').value.trim());if(!d.found){result.textContent='رقم الطلب غير موجود. تأكد من كتابته بشكل صحيح.';return;}result.innerHTML='<strong>طلب القارئ: '+esc(d.name)+'</strong><br>رقم الطلب: <b class="id">'+esc(d.requestId)+'</b><br>السورة: '+esc(d.surah)+'<br><span class="status">'+esc(d.status)+'</span>'+(d.notes?'<br>ملاحظة الإدارة: '+esc(d.notes):'')+'<br><small>تاريخ التسجيل: '+esc(d.date)+'</small>';}catch(err){result.textContent=err.message||'حدث خطأ أثناء البحث.';}});
const params=new URLSearchParams(location.search);if(params.get('id')){document.getElementById('requestId').value=params.get('id');document.getElementById('trackForm').requestSubmit();}
</script>
</body></html>
