<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>الملف الشخصي | داعم المواهب للقرآن الكريم</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--gold:#d4af37;--bg:#070a10;--panel:#111823;--line:rgba(212,175,55,.28);--muted:#aab2bf}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#18202b,var(--bg) 58%);color:#f7f4ec;font-family:Tahoma,Arial,sans-serif;min-height:100vh}.wrap{max-width:850px;margin:25px auto;padding:0 15px}.nav{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:18px}.nav a,.btn{border:1px solid var(--line);border-radius:12px;padding:10px 15px;color:var(--gold);text-decoration:none;background:#121a25;cursor:pointer}.card{background:linear-gradient(145deg,rgba(20,29,41,.97),rgba(9,13,20,.97));border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 15px 45px #0008}.cover{height:210px;background:linear-gradient(120deg,#282319,#101a28);background-size:cover;background-position:center}.identity{padding:0 25px 22px;position:relative}.avatar{width:112px;height:112px;border-radius:50%;object-fit:cover;border:4px solid var(--panel);margin-top:-56px;background:#222}.name{font-size:1.5rem;font-weight:bold;margin:10px 0}.verified{color:#45a8ff;font-size:1.1rem;margin-right:7px}.muted{color:var(--muted);line-height:1.8}.bio{white-space:pre-wrap;line-height:1.9;margin:15px 0}.edit{padding:22px;border-top:1px solid var(--line)}label{display:block;color:var(--gold);margin:12px 0 6px}input,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #344052;background:#080e17;color:white;font:inherit}textarea{min-height:100px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.status{padding:10px;color:var(--gold);min-height:30px}@media(max-width:600px){.grid{grid-template-columns:1fr}.cover{height:160px}}

/* Unified Facebook-inspired platform header */
.social-header{position:sticky;top:0;z-index:1000;display:flex;align-items:center;justify-content:space-between;gap:18px;width:100%;min-height:76px;padding:8px clamp(12px,3vw,34px);margin:0 0 22px;background:rgba(10,15,23,.96);border-bottom:1px solid rgba(212,175,55,.28);box-shadow:0 8px 28px rgba(0,0,0,.24);backdrop-filter:blur(16px);direction:rtl}
.social-brand{display:flex;align-items:center;justify-content:center;flex:0 0 62px;width:62px;height:58px;border-radius:15px;text-decoration:none}
.social-brand img{display:block;width:54px;height:54px;object-fit:contain;filter:drop-shadow(0 0 10px rgba(212,175,55,.3))}
.social-nav{display:flex;align-items:center;justify-content:center;gap:clamp(4px,1.5vw,18px);flex:1;min-width:0}
.social-nav a{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;min-width:58px;min-height:50px;padding:8px 13px;border-radius:13px;color:#d9e0eb;text-decoration:none;font-weight:700;transition:background .2s,color .2s,transform .2s}
.social-nav a i{font-size:1.35rem;color:#e1c36b}
.social-nav a span{display:none}
.social-nav a:hover,.social-nav a:focus-visible{background:rgba(212,175,55,.13);color:#fff;transform:translateY(-1px);outline:none}
.social-nav a[aria-current="page"]{background:rgba(212,175,55,.16);color:#fff;box-shadow:inset 0 -3px #d4af37}
.social-header-extra{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.social-header-extra .btn{white-space:nowrap}
@media(max-width:700px){.social-header{min-height:66px;gap:5px;padding:6px 8px;margin-bottom:14px}.social-brand{flex-basis:46px;width:46px;height:48px}.social-brand img{width:43px;height:43px}.social-nav{gap:2px;justify-content:space-around}.social-nav a{min-width:0;min-height:48px;padding:7px 9px;border-radius:11px}.social-nav a i{font-size:1.3rem}.social-nav a span{display:none}.social-header-extra{gap:4px}.social-header-extra .btn{padding:7px 9px;font-size:.78rem}}
@media(max-width:390px){.social-header{padding-inline:5px}.social-brand{flex-basis:40px;width:40px}.social-brand img{width:38px;height:38px}.social-nav a{padding-inline:7px}.social-nav a i{font-size:1.18rem}}

</style></head>
<body><main class="wrap">
<header class="social-header" aria-label="رأس منصة داعم المواهب">
  <a class="social-brand" href="index.html" aria-label="داعم المواهب - الرئيسية"><img src="https://i.postimg.cc/0yZxfgx2/Picsart-26-01-13-17-01-28-072.png" alt="شعار داعم المواهب"></a>
  <nav class="social-nav" aria-label="التنقل الرئيسي">
    <a href="index.html" aria-label="الرئيسية" title="الرئيسية"><i class="bi bi-house-door-fill"></i><span>الرئيسية</span></a>
    <a href="index.html#communityPanel" aria-label="المجتمع" title="المجتمع"><i class="bi bi-people-fill"></i><span>المجتمع</span></a>
    <a href="posts.html" aria-label="المنشورات" title="المنشورات"><i class="bi bi-grid-3x3-gap-fill"></i><span>المنشورات</span></a>
    <a href="messages.html" aria-label="الرسائل" title="الرسائل"><i class="bi bi-chat-dots-fill"></i><span>الرسائل</span></a>
    <a href="profile.html" aria-label="الملف الشخصي" title="الملف الشخصي"><i class="bi bi-person-circle"></i><span>ملفي</span></a>
    <a href="donate.html" aria-label="التبرع" title="التبرع"><i class="bi bi-heart-fill"></i><span>تبرع</span></a>
  </nav>
  
</header>
<div id="managedTopAds" class="managed-ads" hidden></div>
<section class="card"><div class="cover" id="cover"></div><div class="identity"><img class="avatar" id="avatar" alt="الصورة الشخصية"><div class="name" id="name">جاري تحميل الملف...</div><div class="muted" id="location"></div><div class="bio" id="bio"></div><div class="muted" id="website"></div><div class="muted" id="joined"></div></div>
<div class="edit" id="editPanel" hidden><h3 style="color:var(--gold)">تعديل ملفي الشخصي</h3><form id="profileForm"><label>الاسم الظاهر</label><input id="displayName" maxlength="80" required><label>نبذة عنك</label><textarea id="bioInput" maxlength="600"></textarea><div class="grid"><div><label>المدينة</label><input id="locationInput" maxlength="100"></div><div><label>رابط موقعك</label><input id="websiteInput" type="url" placeholder="https://..."></div></div><label>رابط الصورة الشخصية</label><input id="avatarInput" type="url" placeholder="https://..."><label>رابط صورة الغلاف</label><input id="coverInput" type="url" placeholder="https://..."><p class="muted">شارة التوثيق يمنحها مدير المنصة فقط ولا يمكن تعديلها من هنا.</p><button class="btn" type="submit">حفظ التعديلات</button></form></div></section><section class="card" style="margin-top:16px;padding:20px"><h3 style="color:var(--gold);margin-top:0">منشورات العضو</h3><div id="profileStats" class="muted"></div><div id="profilePosts" class="muted">جاري تحميل المنشورات...</div></section><div class="status" id="status" role="status"></div>
<div id="managedBottomAds" class="managed-ads" hidden></div></main><script>
(()=>{'use strict';const URL='https://xkraqrjkimkdawlazjyl.supabase.co',KEY='sb_publishable_QXPRwlQsN2-5a-hy5ejKJA_2tmf7MJr';const db=window.supabase.createClient(URL,KEY),$=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fallback="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23212b38'/%3E%3Ccircle cx='50' cy='36' r='18' fill='%23d4af37'/%3E%3Cpath d='M12 100c4-28 18-40 38-40s34 12 38 40' fill='%23d4af37'/%3E%3C/svg%3E";let profile=null,user=null;const say=t=>$('status').textContent=t||'';function render(p){profile=p;$('name').innerHTML=esc(p.display_name||'عضو')+(p.is_verified?'<i class="bi bi-patch-check-fill verified" title="حساب موثق" aria-label="حساب موثق"></i>':'');$('avatar').src=p.avatar_url||fallback;$('cover').style.backgroundImage=p.cover_url?`url("${String(p.cover_url).replace(/["\\]/g,'')}")`:'';$('location').textContent=p.location||'';$('bio').textContent=p.bio||'لم يضف العضو نبذة شخصية بعد.';$('website').innerHTML=p.website?`<a href="${esc(p.website)}" target="_blank" rel="noopener noreferrer" style="color:var(--gold)">زيارة الموقع الشخصي</a>`:'';$('joined').textContent=p.created_at?'عضو منذ '+new Date(p.created_at).toLocaleDateString('ar-EG'):'';if(user&&user.id===p.id){$('editPanel').hidden=false;$('displayName').value=p.display_name||'';$('bioInput').value=p.bio||'';$('locationInput').value=p.location||'';$('websiteInput').value=p.website||'';$('avatarInput').value=p.avatar_url||'';$('coverInput').value=p.cover_url||'';}}
async function loadAds(){const {data,error}=await db.rpc('get_public_ads',{p_page_path:location.pathname||'/'});if(error||!Array.isArray(data))return;const draw=(slotId,places)=>{const slot=$(slotId);if(!slot)return;let rows=data.filter(a=>places.includes(String(a.placement||'').toLowerCase()));const groups=new Map(),singles=[];rows.forEach(a=>a.rotation_group?(groups.has(a.rotation_group)||groups.set(a.rotation_group,[]),groups.get(a.rotation_group).push(a)):singles.push(a));rows=[...singles,...[...groups.values()].map(g=>g[Math.floor(Math.random()*g.length)])];slot.innerHTML='';rows.forEach(a=>{const link=document.createElement('a');link.className='managed-ad-card';link.href=a.target_url||'#';link.target='_blank';link.rel='noopener noreferrer sponsored';if(a.image_url){const img=document.createElement('img');img.src=a.image_url;img.alt=a.title||'إعلان';link.appendChild(img)}const text=document.createElement('div');text.className='managed-ad-copy';text.textContent=a.ad_text||a.title||'';link.appendChild(text);slot.appendChild(link);db.rpc('track_public_ad_event',{p_ad_id:a.id,p_event_type:'impression',p_page_path:location.pathname||'/'});link.addEventListener('click',()=>db.rpc('track_public_ad_event',{p_ad_id:a.id,p_event_type:'click',p_page_path:location.pathname||'/'}));});slot.hidden=!rows.length};draw('managedTopAds',['header','top','top_of_page','all_pages']);draw('managedBottomAds',['footer','bottom','bottom_of_page']);}
async function load(){const id=new URLSearchParams(location.search).get('id');const {data:{session}}=await db.auth.getSession();user=session?.user||null;if(!id&&!user){say('سجّل الدخول لعرض ملفك الشخصي.');return;}const {data,error}=await db.rpc('get_public_profile',{p_user_id:id||user.id});if(error)throw error;if(!data){say('الملف الشخصي غير موجود.');return;}render(data);await loadProfilePosts(data.id);}
async function loadProfilePosts(profileId){const box=$('profilePosts'),stats=$('profileStats');const [{data:posts,error},{count:followers},{count:following}]=await Promise.all([db.from('platform_posts').select('id,content,image_url,link_url,created_at,visibility').eq('user_id',profileId).eq('is_published',true).order('created_at',{ascending:false}).limit(30),db.from('profile_follows').select('*',{count:'exact',head:true}).eq('following_id',profileId),db.from('profile_follows').select('*',{count:'exact',head:true}).eq('follower_id',profileId)]);stats.textContent=`${followers||0} متابع · يتابع ${following||0}`;if(error){box.textContent='تعذر تحميل المنشورات. شغّل ملف platform-posts.sql أولاً.';return;}box.innerHTML=(posts||[]).map(post=>`<article style="border-top:1px solid var(--line);padding:14px 0"><div class="muted">${new Date(post.created_at).toLocaleString('ar-EG')}</div><p style="white-space:pre-wrap;line-height:1.9">${esc(post.content)}</p>${post.image_url?`<img src="${esc(post.image_url)}" style="max-width:100%;max-height:400px;border-radius:12px">`:''}${post.link_url?`<p><a href="${esc(post.link_url)}" target="_blank" rel="noopener" style="color:var(--gold)">فتح الرابط</a></p>`:''}</article>`).join('')||'لا توجد منشورات حتى الآن.';}
$('profileForm').addEventListener('submit',async e=>{e.preventDefault();say('جاري حفظ الملف...');try{const {data,error}=await db.rpc('update_my_public_profile',{p_display_name:$('displayName').value,p_bio:$('bioInput').value,p_location:$('locationInput').value,p_website:$('websiteInput').value,p_avatar_url:$('avatarInput').value,p_cover_url:$('coverInput').value});if(error)throw error;render(data);say('تم حفظ الملف الشخصي.');}catch(e){say('تعذر الحفظ: '+e.message);}});load().catch(e=>say('تعذر تحميل الملف: '+e.message));loadAds().catch(e=>console.warn('Ads unavailable',e));})();
</script></body></html>
