<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مكتبة التلاوات | داعم المواهب</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--gold:#d4af37;--bg:#070a10;--panel:#111a27;--line:rgba(212,175,55,.3);--muted:#aeb7c4}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#182333,var(--bg) 60%);color:#f4f4f4;font-family:Tahoma,Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:0 14px 70px}.social-header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 12px;background:#0a0f17f5;border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}.social-brand img{width:52px;height:52px;object-fit:contain}.social-nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}.social-nav a,.btn{color:#f2d477;text-decoration:none;border:1px solid var(--line);border-radius:12px;padding:9px 12px;background:#131d2a;cursor:pointer;font:inherit}.social-nav a[aria-current=page]{background:#403315}.title{text-align:center;color:var(--gold);margin:25px 0 8px}.sub{text-align:center;color:var(--muted);line-height:1.8}.card{background:linear-gradient(145deg,#172231f2,#0d131df2);border:1px solid var(--line);border-radius:18px;padding:17px;margin:14px 0;box-shadow:0 10px 28px #0005}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.field{display:grid;gap:7px;margin:10px 0}label{color:var(--gold)}input,textarea,select{width:100%;color:#fff;background:#080e17;border:1px solid #354255;border-radius:11px;padding:11px;font:inherit}textarea{min-height:95px}select option{background:#080e17}.muted{color:var(--muted);font-size:.9rem;line-height:1.7}.status{text-align:center;color:var(--gold);min-height:30px}.item{border:1px solid #ffffff1a;border-radius:14px;padding:14px;margin:10px 0;background:#ffffff08}.item h3{color:#f4d36f;margin:0 0 7px}.item audio{width:100%;margin-top:10px}.pill{display:inline-block;padding:4px 9px;border-radius:20px;background:#ffffff12;color:#f4d36f;font-size:.8rem}.actions{display:flex;gap:8px;flex-wrap:wrap}.empty{padding:22px;text-align:center;color:var(--muted)}@media(max-width:650px){.social-header{align-items:flex-start;gap:5px}.social-brand img{width:42px;height:42px}.social-nav{gap:4px}.social-nav a,.btn{padding:7px 8px;font-size:.82rem}}
</style></head><body><main class="wrap"><header class="social-header"><a class="social-brand" href="index.html"><img src="https://i.postimg.cc/0yZxfgx2/Picsart-26-01-13-17-01-28-072.png" alt="شعار داعم المواهب"></a><nav class="social-nav"><a href="index.html"><i class="bi bi-house"></i> الرئيسية</a><a href="community.html" title="القصص والاستطلاعات"><i class="bi bi-stars"></i><span>القصص</span></a><a href="posts.html"><i class="bi bi-grid"></i> المنشورات</a><a href="library.html"><i class="bi bi-headphones"></i> التلاوات</a><a href="readers.html"><i class="bi bi-mic-fill"></i> القراء</a><a href="contests.html"><i class="bi bi-trophy-fill"></i> المسابقات</a><a href="messages.html"><i class="bi bi-chat"></i> الرسائل</a><a href="saved.html"><i class="bi bi-bookmark"></i> المحفوظات</a><a href="donate.html"><i class="bi bi-heart-fill"></i> التبرع</a></nav><button class="btn" id="logoutBtn" hidden>خروج</button></header><h1 class="title"><i class="bi bi-headphones"></i> مكتبة التلاوات القرآنية</h1><p class="sub">استمع إلى التلاوات المعتمدة وادعم أصحاب الأصوات الندية.</p><section class="card"><div class="grid"><div class="field"><label for="search">بحث باسم القارئ أو السورة أو عنوان التلاوة</label><input id="search" placeholder="اكتب كلمة للبحث"></div><div class="field"><label for="surahFilter">تصفية بالسورة</label><input id="surahFilter" placeholder="مثال: سورة الرحمن"></div></div></section><div id="items"></div><div class="status" id="status"></div></main><script>(()=>{'use strict';const URL='https://xkraqrjkimkdawlazjyl.supabase.co',KEY='sb_publishable_QXPRwlQsN2-5a-hy5ejKJA_2tmf7MJr',db=supabase.createClient(URL,KEY),$=id=>document.getElementById(id);let user=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const say=t=>$('status').textContent=t||'';async function session(){const {data:{session}}=await db.auth.getSession();user=session?.user||null;$('logoutBtn').hidden=!user;$('logoutBtn').onclick=async()=>{await db.auth.signOut();location.href='index.html';};db.auth.onAuthStateChange((_e,s)=>{user=s?.user||null;$('logoutBtn').hidden=!user;});}
async function load(){say('جاري تحميل التلاوات...');let q=db.from('quran_recitations').select('id,reader_id,title,surah,audio_url,description,created_at').eq('status','approved').order('created_at',{ascending:false}).limit(100);const readerId=new URLSearchParams(location.search).get('reader');if(readerId)q=q.eq('reader_id',readerId);const {data:rows,error}=await q;if(error)throw error;const ids=[...new Set((rows||[]).map(x=>x.reader_id))];let names={};if(ids.length){const r=await db.from('quran_reader_profiles').select('id,display_name,governorate').in('id',ids);if(r.error)throw r.error;names=Object.fromEntries((r.data||[]).map(x=>[x.id,x]));}const term=$('search').value.trim().toLowerCase(),surah=$('surahFilter').value.trim().toLowerCase();const filtered=(rows||[]).filter(x=>{const n=names[x.reader_id]?.display_name||'';return (!term||[x.title,x.surah,n,x.description].join(' ').toLowerCase().includes(term))&&(!surah||(x.surah||'').toLowerCase().includes(surah));});$('items').innerHTML=filtered.map(x=>{const n=names[x.reader_id]||{};return `<article class="item"><h3>${esc(x.title)}</h3><div class="muted">القارئ: <a style="color:#f4d36f" href="readers.html?id=${encodeURIComponent(x.reader_id)}">${esc(n.display_name||'قارئ')}</a> · ${esc(n.governorate||'')}</div><p>${esc(x.surah||'تلاوة قرآنية')} · ${esc(x.description||'')}</p><audio controls preload="none" src="${esc(x.audio_url)}">متصفحك لا يدعم تشغيل الصوت.</audio></article>`;}).join('')||'<div class="card empty">لا توجد تلاوات معتمدة تطابق البحث حاليًا.</div>';say(`عدد التلاوات المعروضة: ${filtered.length}`);}
$('search').addEventListener('input',()=>load().catch(e=>say(e.message)));$('surahFilter').addEventListener('input',()=>load().catch(e=>say(e.message)));session().then(load).catch(e=>say('تعذر التحميل: '+e.message));})();</script></body></html>
